- id: u7-inventario
  titulo: Inventario de la papelería
  tipo: codigo
  dificultad: 3
  puntos: 30
  enunciado: |
    Completa el programa de inventario. Cada producto es `[nombre, cantidad, precio]`.

    **Funciones**:

    - `buscar_producto(inventario, nombre)`: devuelve la posición del producto (sin importar
      mayúsculas) o `-1` si no existe.
    - `valor_inventario(inventario)`: devuelve la suma de cantidad × precio de todos los productos.
    - `por_agotarse(inventario, minimo)`: devuelve la lista de **nombres** con cantidad menor que
      `minimo`.

    **Menú** (hasta elegir `5`):

    ```texto
    1) Ver inventario
    2) Agregar producto
    3) Vender
    4) Reporte
    5) Salir
    ```

    1. Muestra cada producto con `f"{nombre:<12}{cantidad:>6}{precio:>10.2f}"`.
    2. Pide `Nombre: `. Si ya existe, muestra `Ese producto ya existe`. Si no, pide `Cantidad: `
       y `Precio: `, agrégalo y muestra `Producto agregado`.
    3. Pide `Producto: `; si no existe muestra `No existe ese producto`. Si existe, pide
       `Cantidad: `; si no alcanza muestra `No hay suficiente`; si alcanza, descuéntala y muestra
       `Total a pagar: $65.00`.
    4. Muestra `Valor del inventario: $1057.00` y `Por agotarse (menos de 5): Borrador`
       (los nombres separados por `, `, o `ninguno`).
    5. Muestra `Hasta luego`.
