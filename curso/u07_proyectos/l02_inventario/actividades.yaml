    def buscar_producto(inventario, nombre):
        """Devuelve la posición del producto (sin importar mayúsculas) o -1."""
        for i in range(len(inventario)):
            if inventario[i][0].lower() == nombre.lower():
                return i
        return -1


    def valor_inventario(inventario):
        """Devuelve la suma de cantidad × precio."""
        total = 0
        for nombre, cantidad, precio in inventario:
            total += cantidad * precio
        return total


    def por_agotarse(inventario, minimo):
        """Devuelve los nombres de los productos con cantidad menor que minimo."""
        return [nombre for nombre, cantidad, precio in inventario if cantidad < minimo]


    # Programa principal
    inventario = [
        ["Cuaderno", 20, 35.0],
        ["Lápiz", 50, 6.5],
        ["Borrador", 4, 8.0],
    ]
    opcion = ""
    while opcion != "5":
        print("1) Ver inventario")
        print("2) Agregar producto")
        print("3) Vender")
        print("4) Reporte")
        print("5) Salir")
        opcion = input("Opción: ")
        if opcion == "1":
            for nombre, cantidad, precio in inventario:
                print(f"{nombre:<12}{cantidad:>6}{precio:>10.2f}")
        elif opcion == "2":
            nombre = input("Nombre: ")
            if buscar_producto(inventario, nombre) != -1:
                print("Ese producto ya existe")
            else:
                cantidad = int(input("Cantidad: "))
                precio = float(input("Precio: "))
                inventario.append([nombre, cantidad, precio])
                print("Producto agregado")
        elif opcion == "3":
            i = buscar_producto(inventario, input("Producto: "))
            if i == -1:
                print("No existe ese producto")
            else:
                cantidad = int(input("Cantidad: "))
                if cantidad > inventario[i][1]:
                    print("No hay suficiente")
                else:
                    inventario[i][1] -= cantidad
                    print(f"Total a pagar: ${cantidad * inventario[i][2]:.2f}")
        elif opcion == "4":
            print(f"Valor del inventario: ${valor_inventario(inventario):.2f}")
            nombres = por_agotarse(inventario, 5)
            texto = ", ".join(nombres) if nombres else "ninguno"
            print(f"Por agotarse (menos de 5): {texto}")
        elif opcion == "5":
            print("Hasta luego")
        else:
            print("Opción no válida")
