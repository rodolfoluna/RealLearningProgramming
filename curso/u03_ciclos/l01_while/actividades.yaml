- id: u3-cuenta-regresiva
  titulo: Cuenta regresiva
  tipo: codigo
  enunciado: |
    Pide un número `n` y haz una cuenta regresiva desde `n` hasta 1, y después muestra
    `¡Despegue!`. Con 3:

    ```texto
    Desde: 3
    3
    2
    1
    ¡Despegue!
    ```
  codigo_inicial: |
    n = int(input("Desde: "))
  pistas:
    - "La condición del ciclo puede ser while n >= 1:"
    - Dentro del ciclo muestra n y luego réstale 1.
  pruebas:
    - nombre: Desde 3
      entrada: "3"
      salida: ["3", "2", "1", "¡Despegue!"]
      modo: termina
    - nombre: Desde 5
      entrada: "5"
      salida: ["5", "4", "3", "2", "1", "¡Despegue!"]
      modo: termina
    - nombre: Desde 1
      entrada: "1"
      salida: ["1", "¡Despegue!"]
      modo: termina
  solucion: |
    n = int(input("Desde: "))
    while n >= 1:
        print(n)
        n -= 1
    print("¡Despegue!")

- id: u3-predice-while
  titulo: Siguiendo un while
  tipo: prediccion
  enunciado: ¿Qué muestra este programa?
  codigo: |
    x = 1
    while x < 20:
        print(x)
        x = x * 3
    print("Final:", x)
  salida_esperada: |
    1
    3
    9
    Final: 27
  explicacion: |
    x vale 1, 3, 9… Cuando llega a 27 la condición `x < 20` es falsa y el ciclo termina,
    pero 27 ya se había calculado, por eso se muestra al final.

- id: u3-corrige-infinito
  titulo: Corrige el ciclo infinito
  tipo: codigo
  enunciado: |
    Este programa debería mostrar los números pares del 2 al 10, pero nunca termina.
    Corrígelo (si lo ejecutas, usa **■ Detener**).

    ```texto
    2
    4
    6
    8
    10
    ```
  codigo_inicial: |
    n = 2
    while n <= 10:
        print(n)
  pistas:
    - "¿Qué cambia dentro del ciclo? Si n nunca cambia, la condición siempre es verdadera."
    - Aumenta n en 2 en cada vuelta.
  pruebas:
    - nombre: Pares del 2 al 10
      salida: "2\n4\n6\n8\n10"
      modo: normalizada
  solucion: |
    n = 2
    while n <= 10:
        print(n)
        n += 2
