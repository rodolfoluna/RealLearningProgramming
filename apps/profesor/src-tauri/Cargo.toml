[package]
name = "rlp-profesor"
description = "App Profesor de RealLearningProgramming"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "rlp_profesor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Sin la función "firmar": la App Profesor solo verifica, no contiene la llave de la App Alumno.
rlp-core = { path = "../../../crates/rlp-core", default-features = false, features = ["excel"] }
rlp-puente = { path = "../../../crates/rlp-puente" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
