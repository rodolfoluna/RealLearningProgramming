name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias del sistema (WebKitGTK para compilar Tauri, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev xvfb
      - run: pnpm install --frozen-lockfile
      - name: Compilar el curso y copiar Pyodide
        run: pnpm preparar
      - name: Pruebas del arnés de Python
        run: python3 -m unittest discover packages/python-worker/pruebas
      - name: Validar el curso (CPython)
        run: python3 scripts/validar_curso.py
      - name: Validar el curso (Pyodide)
        run: node scripts/validar-curso-pyodide.mjs
      - name: Formato y lint de Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Pruebas del núcleo (Rust)
        run: cargo test -p rlp-core --features excel
      - name: Núcleo sin SQLite (versión web) y compilado a WebAssembly
        run: |
          cargo test -p rlp-core --no-default-features --features firmar
          cargo clippy -p rlp-core --target wasm32-unknown-unknown --no-default-features --features firmar -- -D warnings
          cargo clippy -p rlp-web --target wasm32-unknown-unknown -- -D warnings
          cargo test -p rlp-web
          echo "WASM_BINDGEN=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_ENV"
      - name: wasm-bindgen (misma versión que Cargo.lock)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN }}
      - name: Núcleo web (pnpm wasm)
        run: pnpm wasm
      - name: Pruebas unitarias (TypeScript)
        run: pnpm vitest run
      - name: Revisión de tipos (Svelte y TypeScript)
        run: |
          pnpm --filter @rlp/alumno check
          pnpm --filter @rlp/alumno-web check
          pnpm --filter @rlp/profesor check
          pnpm --filter @rlp/nucleo-web check
      - name: Sitio web (PWA) compilado, para probarlo sin conexión
        run: pnpm --filter @rlp/alumno-web build
      - name: Pruebas de interfaz (Playwright; la versión web también en WebKit)
        env:
          PLAYWRIGHT_WEBKIT: "1"
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          pnpm exec playwright test
      - name: Autoprueba con las apps reales (Tauri + WebKitGTK + PyInstaller)
        run: |
          python3 -m venv .venv-pyinstaller
          .venv-pyinstaller/bin/pip install --quiet pyinstaller
          pnpm --filter @rlp/alumno build
          pnpm --filter @rlp/profesor build
          cargo build -p rlp-alumno -p rlp-profesor --features tauri/custom-protocol
          RLP_AUTOPRUEBA_EXE=1 RLP_PYTHON="$PWD/.venv-pyinstaller/bin/python" ./scripts/autoprueba.sh
      - name: Capturas de pantalla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: |
            tests/e2e/capturas/
            test-results/
          if-no-files-found: ignore
