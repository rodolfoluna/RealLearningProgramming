name: Build Windows

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Apps portables para Windows
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Llave de firma de la App Alumno (secreto). Sin ella se usa la llave de desarrollo.
      RLP_CLAVE_APP: ${{ secrets.RLP_CLAVE_APP }}
      RLP_CLAVE_APP_PUBLICA: ${{ vars.RLP_CLAVE_APP_PUBLICA }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Llave de firma de producción (solo al publicar)
        if: github.ref_type == 'tag'
        run: cargo run -p rlp-core --example verificar_llave_app
      - run: pnpm install --frozen-lockfile
      - run: pnpm preparar

      - name: Python portátil + PyInstaller (runtime\)
        shell: pwsh
        run: ./scripts/preparar-runtime.ps1

      - name: Probar que el runtime genera un .exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path prueba-exe | Out-Null
          Set-Content prueba-exe\hola.py 'n = input("Nombre: ")' , 'print("Hola,", n)' -Encoding utf8
          runtime\python.exe -m PyInstaller --onefile --console --noconfirm --distpath prueba-exe\dist --workpath prueba-exe\build --specpath prueba-exe prueba-exe\hola.py
          $salida = "Ana" | prueba-exe\dist\hola.exe
          Write-Host $salida
          if (-not ($salida -match "Hola, Ana")) { throw "El ejecutable generado no funcionó" }

      # Cada app se compila por separado: así la App Profesor NO incluye la llave de firma.
      - name: Compilar App Alumno
        run: pnpm --filter @rlp/alumno tauri build --no-bundle
      - name: Compilar App Profesor
        run: pnpm --filter @rlp/profesor tauri build --no-bundle

      - name: Empaquetar carpetas portables
        shell: pwsh
        run: ./scripts/empaquetar.ps1 -Version "${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: rlp-windows-portable
          path: dist-portable/*.zip

  autoprueba-windows:
    name: Autoprueba en WebView2
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Con el secreto configurado, la autoprueba verifica la firma de producción (verde).
      RLP_CLAVE_APP: ${{ secrets.RLP_CLAVE_APP }}
      RLP_CLAVE_APP_PUBLICA: ${{ vars.RLP_CLAVE_APP_PUBLICA }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm preparar
      - run: pnpm --filter @rlp/alumno build
      - run: pnpm --filter @rlp/profesor build
      - run: cargo build -p rlp-alumno -p rlp-profesor --features tauri/custom-protocol
      - name: Python portátil + PyInstaller (runtime\)
        shell: pwsh
        run: ./scripts/preparar-runtime.ps1
      - name: Flujo profesor → alumno → profesor (incluye crear un .exe)
        shell: pwsh
        env:
          RLP_AUTOPRUEBA_EXE: "1"
        run: |
          $env:RLP_PYTHON = (Resolve-Path runtime\python.exe).Path
          ./scripts/autoprueba.ps1

  publicar:
    name: Publicar versión
    if: github.ref_type == 'tag'
    needs: [windows, autoprueba-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rlp-windows-portable
          path: dist
      - name: Notas de la versión (CHANGELOG.md)
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {p = 1; next} /^## \[/ {p = 0} p' CHANGELOG.md > notas.md
          if [ ! -s notas.md ]; then echo "Versión $version" > notas.md; fi
          cat >> notas.md <<'FIN'

          ---
          **Windows**: descarga los dos `-windows.zip` (LP Alumno y LP Profesor) y descomprímelos; no
          requieren instalación ni internet. **Web**: `-web.zip` es el sitio de LP Alumno para cualquier
          hosting. **Android**: `-android-depuracion.apk` (versión de prueba de LP Alumno).

          Guías: [instalación](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/INSTALACION.md),
          [manual del alumno](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/MANUAL-ALUMNO.md) y
          [manual del profesor](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/MANUAL-PROFESOR.md).
          FIN
          cat notas.md
      - uses: softprops/action-gh-release@v2
        with:
          name: LP ${{ github.ref_name }}
          body_path: notas.md
          files: dist/*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
