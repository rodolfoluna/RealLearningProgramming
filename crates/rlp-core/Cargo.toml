[package]
name = "rlp-core"
description = "Núcleo de RealLearningProgramming: cifrado, historial verificable, entregas y verificación"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["firmar"]
# Incluye la llave privada con la que la App Alumno firma eventos y entregas.
# La App Profesor se compila sin esta función: solo verifica.
firmar = []
# Exportación a Excel (.xlsx) de la App Profesor.
excel = ["dep:rust_xlsxwriter"]

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = "1"
hex = "0.4"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
rust_xlsxwriter = { version = "0.99", optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
base64 = "0.22"

[dev-dependencies]
proptest = "1"
tempfile = "3"
