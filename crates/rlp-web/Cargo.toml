[package]
name = "rlp-web"
description = "Núcleo de la App Alumno para la versión web (WebAssembly): perfiles en memoria que la app guarda en IndexedDB"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rlp-core = { path = "../rlp-core", default-features = false, features = ["firmar"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Debe coincidir con la versión de `wasm-bindgen-cli` (scripts/compilar-wasm.mjs lo comprueba).
wasm-bindgen = "=0.2.129"
